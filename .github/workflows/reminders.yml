name: Daily reminders

# Calls the app's reminder endpoint every morning at 7:00 IST (01:30 UTC).
# Needs repository secrets APP_URL (e.g. https://cases.example.com) and CRON_SECRET.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send today's reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$APP_URL/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
